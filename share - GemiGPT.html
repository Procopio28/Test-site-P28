<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lime-It • Local P2P Transfer</title>

<!-- PeerJS (signaling only, data is P2P) -->
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<style>
:root {
    --lime:#39ff14;
    --dark:#121212;
    --panel:#1e1e1e;
    --text:#e0e0e0;
}
body{
    margin:0;
    padding:20px;
    font-family:Courier New, monospace;
    background:var(--dark);
    color:var(--text);
    display:flex;
    justify-content:center;
}
.container{
    width:100%;
    max-width:520px;
    background:var(--panel);
    padding:20px;
    border-radius:12px;
    border:1px solid #333;
}
h1{
    margin:0;
    color:var(--lime);
    text-align:center;
}
.subtitle{
    text-align:center;
    font-size:.75rem;
    opacity:.7;
    margin-bottom:20px;
}
.status-box{
    background:#000;
    border:1px solid var(--lime);
    border-radius:6px;
    padding:12px;
    text-align:center;
}
.id-display{
    font-size:1.6rem;
    color:var(--lime);
    letter-spacing:3px;
    cursor:pointer;
}
.row{
    display:flex;
    gap:10px;
    margin-top:15px;
}
input{
    flex:1;
    padding:10px;
    background:#333;
    border:1px solid #555;
    color:#fff;
    border-radius:4px;
}
button{
    padding:10px 16px;
    background:var(--lime);
    border:none;
    font-weight:bold;
    cursor:pointer;
}
.transfer{
    display:none;
    margin-top:25px;
    border-top:1px solid #333;
    padding-top:20px;
}
.drop{
    border:2px dashed #555;
    padding:40px;
    text-align:center;
    border-radius:8px;
    cursor:pointer;
}
.drop.hover{
    border-color:var(--lime);
    background:rgba(57,255,20,.1);
}
.progress{
    display:none;
    height:10px;
    background:#333;
    border-radius:5px;
    overflow:hidden;
    margin-top:15px;
}
.fill{
    height:100%;
    width:0%;
    background:var(--lime);
}
.log{
    margin-top:20px;
    font-size:.75rem;
    color:#888;
    height:120px;
    overflow:auto;
    border-top:1px solid #333;
    padding-top:10px;
}
</style>
</head>

<body>
<div class="container">

<h1>Lime-It</h1>
<div class="subtitle">Browser-only • Local P2P • LimeWire vibes</div>

<div id="connectPanel">
    <div class="status-box">
        <div>Your ID</div>
        <div class="id-display" id="myId" onclick="copyId()">----</div>
        <div style="font-size:.7rem;opacity:.6">(tap to copy)</div>
    </div>

    <div class="row">
        <input id="remoteId" placeholder="Partner ID">
        <button onclick="connect()">Connect</button>
    </div>
</div>

<div id="transferPanel" class="transfer">
    <h3 style="color:var(--lime)">Connected</h3>

    <div class="drop" id="dropZone">
        Click or drop a file here
        <input type="file" id="fileInput" hidden>
    </div>

    <div class="progress" id="progress">
        <div class="fill" id="fill"></div>
    </div>

    <div id="status" style="margin-top:10px;text-align:center"></div>
</div>

<div class="log" id="log"></div>

</div>

<script>
/* ---------- Utils ---------- */
const logEl = document.getElementById("log");
function log(msg){
    const t=new Date().toLocaleTimeString();
    logEl.innerHTML=`[${t}] ${msg}<br>`+logEl.innerHTML;
}

/* ---------- Peer Setup ---------- */
const myId = Math.floor(1000+Math.random()*9000).toString();
document.getElementById("myId").innerText=myId;

const peer = new Peer(myId,{debug:1});
let conn=null;

peer.on("open",()=>log("Ready"));
peer.on("connection",c=>setup(c));

function connect(){
    const id=document.getElementById("remoteId").value.trim();
    if(!id) return alert("Enter an ID");
    setup(peer.connect(id));
}

function setup(c){
    conn=c;
    conn.on("open",()=>{
        log("Connected");
        document.getElementById("transferPanel").style.display="block";
        document.getElementById("connectPanel").style.opacity=.5;
    });
    conn.on("data",handleIncoming);
    conn.on("close",()=>log("Disconnected"));
}

/* ---------- File Transfer (FIXED) ---------- */
const CHUNK=64*1024;
let incoming=null;

async function sendFile(file){
    const total=Math.ceil(file.size/CHUNK);
    conn.send({type:"meta",name:file.name,size:file.size,mime:file.type,total});

    let offset=0, index=0;
    showProgress();

    while(offset<file.size){
        while(conn._dc.bufferedAmount>8*1024*1024){
            await new Promise(r=>setTimeout(r,10));
        }
        const slice=file.slice(offset,offset+CHUNK);
        const buf=await slice.arrayBuffer();
        conn.send({type:"chunk",index,data:buf});
        offset+=buf.byteLength;
        index++;
        updateProgress(offset/file.size*100,"Sending");
    }
    conn.send({type:"end"});
    log("Send complete");
}

function handleIncoming(msg){
    if(msg.type==="meta"){
        incoming={
            name:msg.name,
            mime:msg.mime,
            total:msg.total,
            received:new Array(msg.total),
            count:0
        };
        showProgress();
        log("Receiving "+msg.name);
    }
    else if(msg.type==="chunk"){
        if(!incoming.received[msg.index]){
            incoming.received[msg.index]=msg.data;
            incoming.count++;
        }
        updateProgress(incoming.count/incoming.total*100,"Receiving");
    }
    else if(msg.type==="end"){
        if(incoming.count!==incoming.total){
            log("Missing chunks – aborted");
            return;
        }
        const blob=new Blob(incoming.received,{type:incoming.mime});
        download(blob,incoming.name);
        updateProgress(100,"Complete");
        incoming=null;
    }
}

/* ---------- UI ---------- */
const progress=document.getElementById("progress");
const fill=document.getElementById("fill");
const status=document.getElementById("status");

function showProgress(){
    progress.style.display="block";
    fill.style.width="0%";
}
function updateProgress(p,text){
    fill.style.width=p+"%";
    status.innerText=text+" "+Math.round(p)+"%";
}
function download(blob,name){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name;
    a.click();
    URL.revokeObjectURL(a.href);
}
function copyId(){
    navigator.clipboard.writeText(myId);
    alert("Copied");
}

/* ---------- Drag & Drop ---------- */
const dz=document.getElementById("dropZone");
const fi=document.getElementById("fileInput");

dz.onclick=()=>fi.click();
fi.onchange=e=>sendFile(e.target.files[0]);

dz.ondragover=e=>{e.preventDefault();dz.classList.add("hover");};
dz.ondragleave=e=>dz.classList.remove("hover");
dz.ondrop=e=>{
    e.preventDefault();
    dz.classList.remove("hover");
    sendFile(e.dataTransfer.files[0]);
};
</script>
</body>
</html>
